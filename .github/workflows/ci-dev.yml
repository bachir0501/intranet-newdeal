name: CI Pipeline — Branche dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build Image Docker (nginx:alpine3.23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Construction de l image Docker
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            .

      - name: Sauvegarde de l image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            | gzip > /tmp/intranet-image.tar.gz

      - name: Upload de l image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/intranet-image.tar.gz
          retention-days: 1

  security-scan:
    name: Scan Securite (Vulnerabilites + Secrets)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Telechargement de l image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l image
        run: docker load < /tmp/intranet-image.tar.gz

      - name: Installation de Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q
          sudo apt-get install -y trivy

      - name: Scan des vulnerabilites
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-to-registry:
    name: Push Image vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Telechargement de l image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l image
        run: docker load < /tmp/intranet-image.tar.gz

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag et Push de l image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest