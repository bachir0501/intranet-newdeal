name: CI/CD Pipeline Evolue

on:
  push:
    branches: [ dev, prod ]
  pull_request:
    branches: [ dev, prod ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: intranet-newdeal-prod

jobs:
  build:
    name: Build Image (nginx:alpine3.23-slim)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Build avec image slim
        run: |
          sed -i 's|FROM nginx:alpine3.23|FROM nginx:alpine3.23-slim|' Dockerfile
          docker build \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Sauvegarde de l image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            | gzip > /tmp/intranet-image.tar.gz

      - name: Upload de l image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/intranet-image.tar.gz
          retention-days: 1

  security-scan:
    name: Scan Securite (Bloque si CRITICAL)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Telechargement de l image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l image
        run: docker load < /tmp/intranet-image.tar.gz

      - name: Installation de Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q
          sudo apt-get install -y trivy

      - name: Scan complet des vulnerabilites
        run: |
          trivy image \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Blocage si vulnerabilite CRITICAL
        run: |
          CRITICAL_COUNT=$(trivy image \
            --severity CRITICAL \
            --format json \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            | jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity=="CRITICAL")] | length')
          echo "Vulnerabilites CRITICAL : $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo "BLOQUE : $CRITICAL_COUNT vulnerabilite(s) CRITICAL detectee(s) !"
            exit 1
          fi
          echo "Aucune vulnerabilite CRITICAL — OK"

      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-to-registry:
    name: Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref_name == 'dev'
    steps:
      - name: Telechargement de l image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Chargement de l image
        run: docker load < /tmp/intranet-image.tar.gz

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

  notify-success:
    name: Notification Email Succes
    runs-on: ubuntu-latest
    needs: [push-to-registry]
    if: always() && needs.push-to-registry.result == 'success'
    steps:
      - name: Envoi email de succes
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline reussi — branche ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD Intranet MCTN <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>Pipeline CI/CD — Succes</h2>
            <p>Branche : ${{ github.ref_name }}</p>
            <p>Commit : ${{ github.sha }}</p>
            <p>Auteur : ${{ github.actor }}</p>
            <p>Image : ${{ env.IMAGE_NAME }}:latest</p>

  notify-failure:
    name: Notification Email Echec
    runs-on: ubuntu-latest
    needs: [build, security-scan, push-to-registry]
    if: |
      always() &&
      (needs.build.result == 'failure' ||
       needs.security-scan.result == 'failure' ||
       needs.push-to-registry.result == 'failure')
    steps:
      - name: Envoi email d echec
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline echoue — branche ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD Intranet MCTN <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2>Pipeline CI/CD — Echec</h2>
            <p>Branche : ${{ github.ref_name }}</p>
            <p>Commit : ${{ github.sha }}</p>
            <p>Statut Build : ${{ needs.build.result }}</p>
            <p>Statut Scan : ${{ needs.security-scan.result }}</p>
            <p>Statut Push : ${{ needs.push-to-registry.result }}</p>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              Voir les details
            </a>